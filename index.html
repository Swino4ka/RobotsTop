<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#171a12">
    <title>RobotsTop</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>

<body>
    <div class="page-shell">
        <header class="site-header">
            <a class="brand" href="index.html" aria-label="RobotsTop home">
                <button>RobotsTop (Use this button to go back to navigation page)</button>
            </a>
        </header>
        <main class="welcome-layout">
            <figure class="official-logo">
                <img src="images/thing.png" alt="Geometry Dash account manager logo">
                <figcaption class="site-notice">This is an unofficial fan-made redesign. This page is not affiliated
                    with, endorsed by, or operated by RobTop Games. Geometry Dash and its logos are the property of
                    their respective owners and are used here for identification purposes only. This page is a UI
                    redesign concept and does not provide official account management or account recovery services. For
                    official account services, visit <a href="https://www.boomlings.com/">Boomlings</a>.</figcaption>
            </figure>
            <section class="welcome-card" aria-labelledby="welcome-title">
                <h1 id="welcome-title">NAVIGATION</h1>
                <p class="welcome-copy">Click da butns to see the pages (re captcha is just for show it won't work
                    without the boomlings domain, but it works, tested myself)</p>
                <div class="welcome-actions">
                    <a class="button button-primary" href="pages/accountManager.html">Sign in</a>
                    <a class="button button-secondary" href="pages/register.html">Register</a>
                </div>
                <nav class="help-grid" aria-label="Account options">
                    <a class="help-link" href="pages/lostPassword.html"><span class="help-icon"
                            aria-hidden="true">↻</span><strong>Reset password</strong><span class="help-arrow"
                            aria-hidden="true">→</span></a>

                    <a class="help-link" href="pages/lostUsername.html"><span class="help-icon"
                            aria-hidden="true">✉</span><strong>Find username</strong><span class="help-arrow"
                            aria-hidden="true">→</span></a>

                    <a class="help-link" href="pages/resendActivation.html"><span class="help-icon"
                            aria-hidden="true">✓</span><strong>Activate account</strong><span class="help-arrow"
                            aria-hidden="true">→</span></a>

                    <a class="help-link" href="pages/invalidEmail.html"><span class="help-icon"
                            aria-hidden="true">✉</span><strong>Fix invalid email</strong><span class="help-arrow"
                            aria-hidden="true">→</span></a>

                    <a class="help-link" href="pages/takeback.html"><span class="help-icon"
                            aria-hidden="true">✉</span><strong>Takeback</strong><span class="help-arrow"
                            aria-hidden="true">→</span></a>
                </nav>
            </section>
        </main>
    </div>
</body>

</html>
