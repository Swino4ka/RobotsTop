<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#171a12">
	<title>Create account | RobotsTop</title>
	<link rel="stylesheet" href="../css/style.css">
	<script src="../js/app.js" defer></script>
	<script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>

<body>
	<div class="page-shell">
		<header class="site-header">
			<a class="brand" href="../index.html" aria-label="RobotsTop home">
				<button>RobotsTop (Use this button to go back to navigation page)</button>
			</a>
			<a class="header-link" href="../index.html">← Home</a>
		</header>
		<main class="form-layout">
			<figure class="official-logo">
				<img src="../images/thing.png" alt="Geometry Dash account manager logo">
				<figcaption class="site-notice">This is an unofficial fan-made redesign. This page is not affiliated
					with, endorsed by, or operated by RobTop Games. Geometry Dash and its logos are the property of
					their respective owners and are used here for identification purposes only. This page is a UI
					redesign concept and does not provide official account management or account recovery services. For
					official account services, visit <a href="https://www.boomlings.com/">Boomlings</a>.</figcaption>
			</figure>
			<section class="form-card">
				<h1>Create your account</h1>
				<p class="form-intro">Fill in your details to get started with RobotsTop.</p>
				<form action="./register.php" method="post">
					<fieldset>
						<legend>Register</legend>
						<div class="field"><label for="username">Username</label><input name="username" type="text"
								id="username" maxlength="15" value="" size="30" autocomplete="username"></div>
						<div class="field"><label for="password">Password</label><input name="password" type="password"
								id="password" maxlength="64" value="" size="30" autocomplete="new-password"></div>
						<div class="field"><label for="password2">Re-type password</label><input name="password2"
								type="password" id="password2" maxlength="64" value="" size="30"
								autocomplete="new-password"></div>
						<div class="field"><label for="email">Email</label><input name="email" type="text" id="email"
								maxlength="75" value="" size="30" autocomplete="email"></div>
						<div class="captcha-wrap">
							<div class="g-recaptcha" data-sitekey="6LeLCGcUAAAAACTr37ion5rWw-yDlAuFxDJgRz6w"
								data-callback="enableBtn"></div>
						</div>
						<button type="submit" id="button1" name="register" value="register" class="submit-button"
							disabled>Create account</button>
					</fieldset>
				</form>
				<form class="back-form" action="./accountManagement.php" method="post"><button class="back-button"
						name="back" type="submit" value="Back">Back to account</button></form>
			</section>
		</main>
	</div>
</body>

</html>
