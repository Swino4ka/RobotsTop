<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#171a12">
	<title>Sign in | RobotsTop</title>
	<link rel="stylesheet" href="../css/style.css">
	<script src="../js/app.js" defer></script>
	<script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>

<body>
	<div class="page-shell">
		<header class="site-header">
			<a class="brand" href="../index.html" aria-label="RobotsTop home">
				<button>RobotsTop (Use this button to go back to navigation page)</button>
			</a>
			<a class="header-link" href="../index.html">← Home</a>
		</header>
		<main class="form-layout">
			<figure class="official-logo">
				<img src="../images/thing.png" alt="Geometry Dash account manager logo">
				<figcaption class="site-notice">This is an unofficial fan-made redesign. This page is not affiliated
					with, endorsed by, or operated by RobTop Games. Geometry Dash and its logos are the property of
					their respective owners and are used here for identification purposes only. This page is a UI
					redesign concept and does not provide official account management or account recovery services. For
					official account services, visit <a href="https://www.boomlings.com/">Boomlings</a>.</figcaption>
			</figure>
			<section class="form-card">
				<h1>Sign in</h1>
				<form name="login-form" id="login-form" method="post" action="./accountManagement.php">
					<fieldset>
						<legend>Please login</legend>
						<div class="field">
							<label for="username">Username</label>
							<input tabindex="1" accesskey="u" name="username" type="text" maxlength="30" id="username"
								autocomplete="username">
						</div>
						<div class="field">
							<label for="password">Password</label>
							<input tabindex="2" accesskey="p" name="password" type="password" maxlength="64"
								id="password" autocomplete="current-password">
						</div>
						<div class="captcha-wrap">
							<div class="g-recaptcha" data-sitekey="6LeLCGcUAAAAACTr37ion5rWw-yDlAuFxDJgRz6w"
								data-callback="enableBtn"></div>
						</div>
						<button type="submit" id="button1" name="cmdlogin" value="Login" class="submit-button"
							disabled>Login</button>
					</fieldset>
				</form>
				<nav class="help-grid account-options" aria-label="Account options">
					<a class="help-link" href="./register.php"><span class="help-icon"
							aria-hidden="true">+</span><strong>Register</strong><span class="help-arrow"
							aria-hidden="true">→</span></a>
					<a class="help-link" href="./lostpassword.php"><span class="help-icon"
							aria-hidden="true">↻</span><strong>Forgot password?</strong><span class="help-arrow"
							aria-hidden="true">→</span></a>
					<a class="help-link" href="./lostusername.php"><span class="help-icon"
							aria-hidden="true">@</span><strong>Forgot username?</strong><span class="help-arrow"
							aria-hidden="true">→</span></a>
					<a class="help-link" href="./resendActivation.php"><span class="help-icon"
							aria-hidden="true">✓</span><strong>Resend activation</strong><span class="help-arrow"
							aria-hidden="true">→</span></a>
					<a class="help-link" href="./invalidEmail.php"><span class="help-icon"
							aria-hidden="true">✉</span><strong>Invalid email?</strong><span class="help-arrow"
							aria-hidden="true">→</span></a>
				</nav>
			</section>
		</main>
	</div>
</body>

</html>
